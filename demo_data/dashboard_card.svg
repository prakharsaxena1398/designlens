<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-label="Loan portfolio collections dashboard mockup">
  <!-- page background -->
  <rect x="0" y="0" width="900" height="560" fill="#EEF1F6"/>
  <!-- sidebar -->
  <rect x="0" y="0" width="220" height="560" fill="#1F3A5F"/>
  <text x="24" y="44" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">DesignLens</text>
  <text x="24" y="110" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Dashboard</text>
  <text x="24" y="146" font-family="system-ui, sans-serif" font-size="14" fill="#A9B7CE">Portfolio</text>
  <text x="24" y="182" font-family="system-ui, sans-serif" font-size="14" fill="#A9B7CE">Settings</text>
  <rect x="24" y="96" width="150" height="24" fill="none"/>
  <!-- main heading -->
  <text x="260" y="56" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#1F2937">Collections Overview</text>
  <text x="260" y="82" font-family="system-ui, sans-serif" font-size="14" fill="#6B7280">Q3 FY26, monthly summary across three zones</text>
  <!-- KPI cards -->
  <rect x="260" y="110" width="190" height="120" rx="10" fill="#FFFFFF"/>
  <text x="278" y="140" font-family="system-ui, sans-serif" font-size="12" fill="#6B7280">AUM</text>
  <text x="278" y="176" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#1F2937">₹482 Cr</text>
  <text x="278" y="204" font-family="system-ui, sans-serif" font-size="12" fill="#6B7280">+4.1% vs last month</text>

  <rect x="470" y="110" width="190" height="120" rx="10" fill="#FFFFFF"/>
  <text x="488" y="140" font-family="system-ui, sans-serif" font-size="12" fill="#6B7280">Active loans</text>
  <text x="488" y="176" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#B0B0B0">12,940</text>
  <text x="488" y="204" font-family="system-ui, sans-serif" font-size="12" fill="#6B7280">+2.8% vs last month</text>

  <rect x="680" y="110" width="190" height="120" rx="10" fill="#FFFFFF"/>
  <text x="698" y="140" font-family="system-ui, sans-serif" font-size="12" fill="#6B7280">DPD 30+</text>
  <text x="698" y="176" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#1F2937">1.9%</text>
  <text x="698" y="204" font-family="system-ui, sans-serif" font-size="12" fill="#6B7280">-0.3 pts vs last month</text>
  <!-- chart panel -->
  <rect x="260" y="260" width="610" height="260" rx="10" fill="#FFFFFF"/>
  <text x="284" y="294" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1F2937">Monthly disbursals by channel</text>
  <!-- bars -->
  <rect x="300" y="380" width="46" height="100" fill="#2F6FED"/>
  <rect x="360" y="340" width="46" height="140" fill="#2F6FED"/>
  <rect x="420" y="300" width="46" height="180" fill="#2F6FED"/>
  <rect x="500" y="360" width="46" height="120" fill="#93B4F8"/>
  <rect x="560" y="320" width="46" height="160" fill="#93B4F8"/>
  <rect x="620" y="336" width="46" height="144" fill="#93B4F8"/>
  <rect x="700" y="392" width="46" height="88" fill="#93B4F8"/>
  <rect x="760" y="352" width="46" height="128" fill="#93B4F8"/>
  <!-- baseline -->
  <rect x="290" y="480" width="556" height="1" fill="#D6DEE8"/>
  <!-- legend -->
  <rect x="284" y="500" width="12" height="12" fill="#2F6FED"/>
  <text x="304" y="511" font-family="system-ui, sans-serif" font-size="12" fill="#6B7280">Direct</text>
  <rect x="372" y="500" width="12" height="12" fill="#93B4F8"/>
  <text x="392" y="511" font-family="system-ui, sans-serif" font-size="12" fill="#6B7280">Partner</text>
</svg>
